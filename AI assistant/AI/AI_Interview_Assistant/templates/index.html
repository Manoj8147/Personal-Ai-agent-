<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎤 AI Interview Assistant</h1>
            <p class="subtitle">Practice interviews with AI feedback</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Control Panel -->
            <section class="control-panel">
                <div class="button-group">
                    <button id="startBtn" class="btn btn-primary">
                        <span class="btn-icon">▶️</span> Start Recording
                    </button>
                    <button id="stopBtn" class="btn btn-danger" disabled>
                        <span class="btn-icon">⏹️</span> Stop Recording
                    </button>
                    <button id="clearBtn" class="btn btn-secondary">
                        <span class="btn-icon">🗑️</span> Clear Transcript
                    </button>
                </div>
                <div class="recording-status">
                    <span id="statusIcon" class="status-icon"></span>
                    <span id="statusText">Ready</span>
                </div>
            </section>

            <!-- Transcript Display -->
            <section class="transcript-section">
                <h2>📝 Transcript</h2>
                <div id="transcriptBox" class="transcript-box">
                    <div class="placeholder">
                        Start recording to see transcript appear here...
                    </div>
                </div>
                <div class="transcript-stats">
                    <span>Total Segments: <strong id="segmentCount">0</strong></span>
                    <span>Word Count: <strong id="wordCount">0</strong></span>
                </div>
            </section>

            <!-- Recording Input (for Phase 1 testing) -->
            <section class="input-section">
                <h3>Test Input (Manual Text Entry)</h3>
                <div class="input-group">
                    <input 
                        type="text" 
                        id="manualInput" 
                        placeholder="Type what you want to add to the transcript..."
                        class="text-input"
                    >
                    <select id="speakerSelect" class="speaker-select">
                        <option value="Interviewer">Interviewer</option>
                        <option value="Candidate" selected>Candidate</option>
                    </select>
                    <button id="addBtn" class="btn btn-secondary">Add to Transcript</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
